<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芯宝 Xinbao - Sweet Cyber OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050a15;
      /* 降低饱和度，使色彩更温和 */
      --neon-cyan: hsl(180, 80%, 70%); /* 软蓝青色 */
      --neon-pink: hsl(320, 80%, 80%); /* 柔粉色 */
      --neon-purple: #B026FF;
      --text-white: #E0F7FA;
      --panel-bg: rgba(5, 10, 21, 0.75);
      --msg-user-bg: rgba(255, 179, 217, 0.1);
      --msg-robot-bg: rgba(102, 248, 255, 0.1);
      --border-cyan: 1px solid rgba(102, 248, 255, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'Press Start 2P', 'Microsoft YaHei', 'SimHei', monospace;
      background-color: #000; color: var(--text-white);
    }

    /* ================= 背景与全局特效 ================= */
    .app-container { position: relative; width: 100%; height: 100%; }
    
    /* 1. 3D 动态全息网格 */
    .grid-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      perspective: 1000px; overflow: hidden; z-index: 1;
      background: radial-gradient(circle at center, #0a1530 0%, #02040a 100%);
    }
    .grid-plane {
      position: absolute; bottom: -20%; left: -50%; width: 200%; height: 150%;
      background-image: 
        linear-gradient(rgba(102, 248, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 248, 255, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: rotateX(60deg);
      animation: grid-move 6s linear infinite; /* 稍微减慢速度 */
      box-shadow: inset 0 0 100px #000;
    }
    @keyframes grid-move {
      0% { transform: rotateX(60deg) translateY(0); }
      100% { transform: rotateX(60deg) translateY(40px); }
    }

    /* 2. CRT 屏幕条纹与暗角 */
    .crt-effect {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 998; pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px;
    }
    .crt-effect::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0) 70%, rgba(0,0,0,0.6) 100%);
    }

    /* === 移除扫描线组件 === */

    /* ================= 屏幕切换机制 ================= */
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; z-index: 10;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out, filter 0.8s;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); filter: blur(10px); z-index: 0; }

    /* ================= 欢迎界面 (科幻切角面板) ================= */
    #welcome-screen { justify-content: center; align-items: center; }
    .welcome-panel {
      position: relative; padding: 60px 80px;
      background: rgba(5, 15, 30, 0.8);
      backdrop-filter: blur(10px);
      /* 科幻切角，增加一些圆角，使整体不那么锋利 */
      clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(102, 248, 255, 0.2);
      display: flex; flex-direction: column; align-items: center;
      border-radius: 15px; /* 增加整体圆角 */
    }
    .welcome-panel::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: 2px solid var(--neon-cyan);
      clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
      pointer-events: none;
    }
    
    .sys-status { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--neon-cyan); margin-bottom: 20px; letter-spacing: 2px; }
    
    .welcome-title { font-size: 48px; line-height: 1.5; text-align: center; margin-bottom: 40px; text-shadow: 4px 4px 0px rgba(0,0,0,0.8), 0 0 20px var(--neon-cyan); font-family: 'Press Start 2P', monospace; }
    .welcome-title .pink-text { color: var(--neon-pink); text-shadow: 4px 4px 0px rgba(0,0,0,0.8), 0 0 20px var(--neon-pink); }
    
    .start-btn {
      background: rgba(102, 248, 255, 0.1); color: var(--neon-cyan); 
      border: 1px solid var(--neon-cyan); padding: 20px 40px;
      font-family: 'Press Start 2P', monospace; font-size: 16px; cursor: pointer;
      position: relative; overflow: hidden;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      transition: all 0.3s;
      border-radius: 8px;
    }
    .start-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: 0.5s; }
    .start-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 30px var(--neon-cyan); }
    .start-btn:hover::before { left: 100%; }

    /* ================= 聊天界面 ================= */
    #chat-screen { justify-content: space-between; }
    
    /* 顶部导航与边框 */
    .header-ui { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: linear-gradient(180deg, rgba(0, 20, 40, 0.8) 0%, transparent 100%); border-bottom: 1px solid rgba(102, 248, 255, 0.1); }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-icon { width: 12px; height: 12px; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); border-radius: 50%; animation: pulse-core 2s infinite; }
    .title-area h1 { font-size: 18px; text-shadow: 0 0 10px var(--neon-cyan); font-family: 'Press Start 2P', monospace; letter-spacing: 1px; }
    .title-area .pink-text { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
    
    .nav-icons { display: flex; gap: 30px; font-size: 14px; font-family: 'Press Start 2P', monospace; }
    .return-btn { color: var(--neon-pink); cursor: pointer; transition: 0.3s; border: 1px solid var(--neon-pink); padding: 8px 12px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); background: rgba(255, 179, 217, 0.1); border-radius: 4px; }
    .return-btn:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }

    /* 侧边 HUD 装饰 - 降低透明度使之更柔和 */
    .hud-side { position: absolute; top: 120px; width: 60px; bottom: 250px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; opacity: 0.5; }
    .hud-left { left: 20px; border-right: var(--border-cyan); }
    .hud-right { right: 20px; border-left: var(--border-cyan); }
    .hud-bar { width: 4px; background: rgba(102, 248, 255, 0.1); border-radius: 2px; overflow: hidden; margin: 10px 0; }
    .hud-bar-inner { width: 100%; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
    .hud-text { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--neon-cyan); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 2px; }

    /* 机器人核心舞台 */
    .center-stage { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; perspective: 1000px; padding-bottom: 20px; }
    .advanced-robot { position: relative; display: flex; flex-direction: column; align-items: center; animation: float 4s ease-in-out infinite; z-index: 15; }
    
    /* 气泡 - 优化为更可爱圆润 */
    .robot-greeting-bubble {
      position: absolute; top: -70px; left: 160px; 
      background: rgba(3, 6, 19, 0.95);
      border: 2px solid var(--neon-cyan); border-left: 5px solid var(--neon-pink);
      padding: 12px 25px; color: var(--text-white); font-size: 14px;
      font-family: 'Microsoft YaHei', 'SimHei', sans-serif; white-space: nowrap;
      box-shadow: 0 0 20px rgba(102, 248, 255, 0.2);
      opacity: 0; transform: scale(0.8) translateY(20px);
      animation: bubble-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s forwards;
      z-index: 20; backdrop-filter: blur(5px);
      border-radius: 15px; /* 增加圆角 */
    }
    .robot-greeting-bubble::after {
      content: ''; position: absolute; bottom: 12px; left: -10px; width: 0; height: 0;
      border-top: 8px solid transparent; border-right: 12px solid var(--neon-pink); border-bottom: 8px solid transparent;
    }
    @keyframes bubble-in { to { opacity: 1; transform: scale(1) translateY(0); } }

    /* 机器人构造 - 可爱化调整 */
    .holo-base-ring { position: absolute; bottom: -75px; width: 220px; height: 80px; border: 1px solid rgba(102, 248, 255, 0.2); border-radius: 50%; transform: rotateX(75deg); animation: spin-reverse 10s linear infinite; pointer-events: none; }
    .holo-base { position: absolute; bottom: -60px; width: 180px; height: 60px; border: 2px dashed rgba(102, 248, 255, 0.6); border-radius: 50%; transform: rotateX(75deg); box-shadow: 0 0 30px rgba(102, 248, 255, 0.2), inset 0 0 20px rgba(102, 248, 255, 0.3); animation: spin 15s linear infinite; pointer-events: none; }
    
    .robot-ears { position: absolute; top: 40px; width: 240px; display: flex; justify-content: space-between; z-index: 1; }
    /* 耳朵变圆润，像小触角 */
    .ear { width: 25px; height: 60px; background: #111; border: 2px solid var(--neon-pink); border-radius: 15px; box-shadow: 0 0 15px rgba(255, 179, 217, 0.4); }
    
    /* 脑袋变圆，边框更柔和 */
    .robot-head { position: relative; width: 200px; height: 160px; background: linear-gradient(135deg, #1a1e2e 0%, #05070f 100%); border: 3px solid var(--neon-cyan); border-radius: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 25px rgba(102,248,255,0.15); display: flex; justify-content: center; align-items: center; z-index: 2; overflow: hidden; }
    /* 脑袋扫描线 - 降低透明度 */
    .head-scanner { position: absolute; width: 100%; height: 2px; background: var(--neon-cyan); opacity: 0.3; animation: head-scan 4s ease-in-out infinite alternate; }
    @keyframes head-scan { 0% { top: 15%; } 100% { top: 85%; } }
    
    .head-led { position: absolute; top: 12px; width: 70px; height: 5px; background: var(--neon-pink); border-radius: 3px; box-shadow: 0 0 15px var(--neon-pink); animation: pulse-led 2s infinite; }
    .robot-screen { width: 160px; height: 100px; background: #01040a; border-radius: 15px; border: 1px solid rgba(102, 248, 255, 0.2); box-shadow: inset 0 0 30px rgba(102, 248, 255, 0.05); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    
    /* 眼睛：更大、更圆、更柔和 */
    .eyes-container { display: flex; gap: 40px; margin-top: -10px; }
    .eye { width: 28px; height: 40px; background: var(--neon-cyan); border-radius: 15px; box-shadow: 0 0 20px var(--neon-cyan); animation: blink-eye 5s infinite; }
    
    /* 腮红：更明显、更害羞 */
    .blush-container { display: flex; gap: 80px; position: absolute; top: 60px; }
    .blush { width: 25px; height: 10px; background: var(--neon-pink); border-radius: 15px; opacity: 0.8; box-shadow: 0 0 15px var(--neon-pink); }
    
    /* 身体变圆，像一个小花瓶 */
    .robot-body { width: 70px; height: 50px; background: #0a0a0a; border: 2px solid var(--neon-cyan); border-top: none; border-radius: 0 0 30px 30px; margin-top: -5px; z-index: 1; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 -10px 20px rgba(102, 248, 255, 0.1); }
    .core { width: 16px; height: 16px; background: var(--neon-pink); border-radius: 50%; box-shadow: 0 0 15px var(--neon-pink); animation: pulse-core 1s ease-in-out infinite; }

    /* 动画 */
    @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
    @keyframes spin { 100% { transform: rotateX(75deg) rotateZ(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotateX(75deg) rotateZ(-360deg); } }
    @keyframes pulse-led { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes pulse-core { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
    /* 眨眼：变得更慢、更温柔 */
    @keyframes blink-eye { 0%, 80%, 90%, 100% { transform: scaleY(1); } 85% { transform: scaleY(0.1); } }

    /* ================= 底部高科技聊天区 ================= */
    .chat-interface { 
      padding: 25px 40px; background: rgba(3, 8, 20, 0.85); 
      border-top: 2px solid rgba(102, 248, 255, 0.3); backdrop-filter: blur(10px);
      box-shadow: 0 -10px 30px rgba(102, 248, 255, 0.05);
    }
    
    .chat-history {
      height: 200px; overflow-y: auto; margin-bottom: 20px; font-size: 13px;
      display: flex; flex-direction: column; gap: 15px; padding-right: 15px;
    }

    .msg-bubble { max-width: 75%; padding: 15px 20px; border-radius: 10px; line-height: 1.6; position: relative; }
    .sys-msg { align-self: center; color: rgba(255, 255, 255, 0.4); font-family: 'Press Start 2P', monospace; font-size: 9px; text-align: center; border: 1px dashed rgba(255, 255, 255, 0.1); padding: 8px 20px; border-radius: 5px; }

    /* 用户消息 - 粉红科幻边框 - 增加圆角 */
    .user-msg {
      align-self: flex-end; background-color: var(--msg-user-bg);
      border: 1px solid var(--neon-pink); border-right: 4px solid var(--neon-pink);
      border-radius: 12px 12px 0 12px; color: var(--text-white);
      box-shadow: 0 0 15px rgba(255, 179, 217, 0.1);
    }
    .user-msg .msg-prefix { color: var(--neon-pink); font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 6px; display: block; }

    /* 机器人消息 - 蓝青科幻边框 - 增加圆角 */
    .robot-msg {
      align-self: flex-start; background-color: var(--msg-robot-bg);
      border: 1px solid var(--neon-cyan); border-left: 4px solid var(--neon-cyan);
      border-radius: 12px 12px 12px 0; color: #E0F7FA;
      box-shadow: 0 0 15px rgba(102, 248, 255, 0.1);
    }
    .robot-msg .msg-prefix { color: var(--neon-cyan); font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 6px; display: block; }
    
    .msg-content { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; letter-spacing: 0.5px; }
    
    .typing-cursor::after { content: '█'; animation: blink-cursor 1s step-end infinite; margin-left: 5px; color: var(--neon-cyan); }
    @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* 输入控件 - 终端风格 - 增加圆角 */
    .input-wrapper {
      display: flex; gap: 15px; position: relative;
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(102, 248, 255, 0.2);
      padding: 5px; border-radius: 10px;
    }
    /* 装饰角 */
    .input-wrapper::before, .input-wrapper::after {
      content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--neon-cyan); pointer-events: none; border-radius: 2px;
    }
    .input-wrapper::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .input-wrapper::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .input-wrapper input {
      flex-grow: 1; background: transparent; border: none; padding: 12px 15px;
      color: var(--neon-cyan); font-family: 'Microsoft YaHei', sans-serif; font-size: 15px; outline: none;
    }
    .input-wrapper input::placeholder { color: rgba(102, 248, 255, 0.2); font-family: 'Press Start 2P', monospace; font-size: 10px; }
    
    .input-wrapper button {
      background: rgba(102, 248, 255, 0.05); color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
      padding: 0 30px; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer; transition: 0.3s;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      border-radius: 8px;
    }
    .input-wrapper button:hover:not(:disabled) { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
    .input-wrapper button:disabled { border-color: #444; color: #555; background: transparent; cursor: not-allowed; }
    
    /* 滚动条科幻定制 */
    .chat-history::-webkit-scrollbar { width: 4px; }
    .chat-history::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    .chat-history::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); border-radius: 2px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="grid-container"><div class="grid-plane"></div></div>
    <div class="crt-effect"></div>
    
    <div id="welcome-screen" class="screen">
      <div class="welcome-panel">
        <div class="sys-status">> NEURAL LINK OFFLINE</div>
        <h1 class="welcome-title">CYBER<br><span class="pink-text">ROBOT</span></h1>
        <button class="start-btn" onclick="startGame()">> PRESS START <</button>
      </div>
    </div>

    <div id="chat-screen" class="screen hidden">
      
      <div class="hud-side hud-left">
        <div class="hud-text">SYS.CORE.01</div>
        <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; width: 100%;">
          <div class="hud-bar" style="height: 40px;"><div class="hud-bar-inner" style="height: 80%;"></div></div>
          <div class="hud-bar" style="height: 80px;"><div class="hud-bar-inner" style="height: 40%; animation: pulse-core 2s infinite;"></div></div>
          <div class="hud-bar" style="height: 30px;"><div class="hud-bar-inner" style="height: 90%;"></div></div>
        </div>
      </div>
      
      <div class="hud-side hud-right">
        <div class="hud-text" style="color: var(--neon-pink);">MEM.USAGE</div>
        <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; width: 100%;">
          <div class="hud-bar" style="height: 60px; background: rgba(255, 179, 217, 0.1);"><div class="hud-bar-inner" style="height: 60%; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink);"></div></div>
          <div class="hud-bar" style="height: 40px; background: rgba(255, 179, 217, 0.1);"><div class="hud-bar-inner" style="height: 30%; background: var(--neon-pink);"></div></div>
        </div>
      </div>

      <header class="header-ui">
        <div class="header-left">
          <div class="header-icon"></div>
          <div class="title-area">
            <h1>CYBER<span class="pink-text">ROBOT</span></h1>
          </div>
        </div>
        <div class="nav-icons">
          <button class="return-btn" onclick="goBack()">[ DISCONNECT ]</button>
        </div>
      </header>

      <main class="center-stage">
        <div class="advanced-robot">
          <div class="robot-greeting-bubble">你好呀！我是你的小助手芯宝~ (^-^)/</div>
          
          <div class="holo-base-ring"></div>
          <div class="holo-base"></div>
          <div class="robot-ears"><div class="ear"></div><div class="ear"></div></div>
          <div class="robot-head">
            <div class="head-scanner"></div>
            <div class="head-led"></div>
            <div class="robot-screen">
              <div class="eyes-container"><div class="eye"></div><div class="eye"></div></div>
              <div class="blush-container"><div class="blush"></div><div class="blush"></div></div>
            </div>
          </div>
          <div class="robot-body"><div class="core"></div></div>
        </div>
      </main>

      <footer class="chat-interface">
        <div class="chat-history" id="chatBox">
          <div class="msg-bubble sys-msg">[ SYSTEM ]: ESTABLISHING SECURE CONNECTION...</div>
          <div class="msg-bubble robot-msg">
            <span class="msg-prefix">> XINBAO:</span>
            <span class="msg-content">SYSTEM ONLINE. READY FOR INPUT.</span>
          </div>
        </div>
        
        <div class="input-wrapper">
          <input type="text" placeholder="[ INPUT COMMAND... ]" id="userInput" autocomplete="off">
          <button id="sendBtn" onclick="sendMessage()">SEND</button>
        </div>
      </footer>
    </div>

  </div>

  <script>
    const welcomeScreen = document.getElementById('welcome-screen');
    const chatScreen = document.getElementById('chat-screen');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');
    let isTyping = false;

    function startGame() {
      welcomeScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      // 随机重置进度条高度模拟数据波动
      setInterval(() => {
        document.querySelectorAll('.hud-bar-inner').forEach(bar => {
           if(Math.random() > 0.5) bar.style.height = Math.floor(Math.random() * 100) + '%';
        });
      }, 2000); // 降低数据波动频率
      setTimeout(() => { input.focus(); }, 800);
    }

    function goBack() {
      if (isTyping) return;
      chatScreen.classList.add('hidden');
      welcomeScreen.classList.remove('hidden');
      setTimeout(() => {
        const sysMsg = document.createElement('div');
        sysMsg.className = 'msg-bubble sys-msg';
        sysMsg.textContent = `[ SYSTEM ]: CONNECTION TERMINATED.`;
        chatBox.appendChild(sysMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }

    // 1. 队友忘记写的画屏幕函数（架构师帮你补上了！）
    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      
      if (sender === 'user') {
        msgDiv.className = 'msg-bubble user-msg';
        msgDiv.innerHTML = `<span class="msg-prefix">> USER:</span><span class="msg-content">${text}</span>`;
      } else {
        msgDiv.className = 'msg-bubble robot-msg';
        msgDiv.innerHTML = `<span class="msg-prefix">> XINBAO:</span><span class="msg-content">${text}</span>`;
      }
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight; // 自动滚到底部
    }

    // 2. 修复后的发送逻辑
    async function sendMessage() {
      const text = input.value.trim(); // 🔴 修复了队友写错的变量名
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      try {
          const response = await fetch('http://127.0.0.1:5000/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: text }) 
          });

          const data = await response.json();
          
          if (data.response) {
              appendMessage('bot', data.response);
          } else {
              appendMessage('bot', "芯宝听不懂你在说什么呢...QwQ");
          }
      } catch (error) {
          console.error('Error:', error);
          appendMessage('bot', "糟糕，芯宝跟大脑失去联系了，快检查下后端开没开呀！");
      }
    }


    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') { sendMessage(); }
    });
  </script>
</body>
</html>
